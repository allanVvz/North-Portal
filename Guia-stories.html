<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia estratégico de stories · Karpinski × north</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --petrol-deep:#0C2A2C;
    --petrol:#102E30;
    --petrol-mid:#143638;
    --petrol-card:#0F3032;
    --cream:#DDD0B5;
    --cream-soft:#E5D9BF;
    --aqua:#7AAEAB;
    --aqua-bright:#92C2BF;
    --aqua-soft:#A9CDCB;
    --mint:#5FA09C;
    --check-green:#2E5F55;
    --text-on-petrol:#ECE0C7;
    --text-on-cream:#0E2D2F;
    --muted-on-petrol:#9EB7B4;
    --muted-on-cream:#4A5E5B;
    --rule-on-petrol:rgba(236,224,199,.14);
    --rule-on-cream:rgba(14,45,47,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#000;overflow:hidden;font-family:'Inter',system-ui,sans-serif;}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  .deck{
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    aspect-ratio:16/9;
    background:var(--petrol-deep);
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .slide{
    position:absolute;inset:0;
    opacity:0;
    transform:translateX(60px);
    transition:opacity .7s cubic-bezier(.22,.7,.2,1), transform .8s cubic-bezier(.22,.7,.2,1);
    pointer-events:none;
    display:flex;flex-direction:column;
    padding:5.5% 6.25%;
  }
  .slide.exit{ transform:translateX(-60px); opacity:0; }
  .slide.active{ opacity:1; transform:translateX(0); pointer-events:auto; z-index:5; }
  .slide.dark{ background:var(--petrol-deep); color:var(--text-on-petrol); }
  .slide.light{ background:var(--cream); color:var(--text-on-cream); }
  .slide.dark::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 70% 30%, rgba(124,174,171,.06), transparent 55%);
  }
  .pagemark{
    position:absolute;top:3.5%;right:6.25%;
    font-size:clamp(10px,.85vw,13px);font-weight:500;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted-on-petrol);
  }
  .slide.light .pagemark{ color:var(--muted-on-cream); }
  .eyebrow{
    font-size:clamp(10px,.85vw,13px);font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    color:var(--aqua);margin-bottom:18px;
  }
  .slide.light .eyebrow{ color:var(--check-green); }
  h1.display{
    font-family:'Fraunces',serif;font-weight:400;font-optical-sizing:auto;
    font-size:clamp(32px,4.6vw,68px);
    line-height:1.05;letter-spacing:-.012em;
    color:var(--text-on-petrol);
  }
  .slide.light h1.display{ color:var(--text-on-cream); }
  h1.display em{ font-style:italic;font-weight:300;color:var(--aqua); }
  .slide.light h1.display em{ color:var(--mint); }
  .subhead{
    font-family:'Fraunces',serif;font-style:italic;font-weight:300;
    font-size:clamp(15px,1.5vw,22px);
    color:var(--aqua);margin-top:8px;
  }
  .slide.light .subhead{ color:var(--mint); }
  .body p{
    font-size:clamp(12.5px,1vw,15px);line-height:1.65;
    color:var(--muted-on-petrol);max-width:62ch;margin-bottom:12px;
  }
  .slide.light .body p{ color:var(--muted-on-cream); }
  .body p strong{ color:var(--text-on-petrol);font-weight:500; }
  .slide.light .body p strong{ color:var(--text-on-cream); }

  ul.dots{ list-style:none;display:flex;flex-direction:column;gap:10px; }
  ul.dots li{
    display:flex;gap:12px;align-items:flex-start;
    font-size:clamp(12px,.95vw,14.5px);line-height:1.55;
    color:var(--text-on-petrol);
  }
  .slide.light ul.dots li{ color:var(--text-on-cream); }
  ul.dots li::before{
    content:"";display:block;
    width:6px;height:6px;background:var(--aqua);transform:rotate(45deg);
    margin-top:8px;flex-shrink:0;
  }
  .slide.light ul.dots li::before{ background:var(--mint); }

  .cols-3{ display:grid;gap:20px;flex:1;align-content:start;padding-top:8px; }
  .col-num .n{
    font-family:'Fraunces',serif;font-weight:400;
    font-size:clamp(26px,2.8vw,42px);color:var(--aqua);line-height:1;
    margin-bottom:12px;
  }
  .slide.light .col-num .n{ color:var(--mint); }
  .col-num h3{
    font-family:'Fraunces',serif;font-weight:500;font-size:clamp(14px,1.25vw,19px);
    color:var(--text-on-petrol);margin-bottom:8px;letter-spacing:-.005em;
  }
  .slide.light .col-num h3{ color:var(--text-on-cream); }
  .col-num p{
    font-size:clamp(11px,.88vw,13px);line-height:1.55;color:var(--muted-on-petrol);
  }
  .slide.light .col-num p{ color:var(--muted-on-cream); }
  .col-num ul{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:8px;}
  .col-num ul li{
    font-size:clamp(11px,.85vw,12.5px);line-height:1.5;color:var(--muted-on-petrol);
    padding-left:10px;position:relative;
  }
  .slide.light .col-num ul li{ color:var(--muted-on-cream); }
  .col-num ul li::before{
    content:"";position:absolute;left:0;top:7px;
    width:3px;height:3px;background:var(--aqua);transform:rotate(45deg);
  }
  .slide.light .col-num ul li::before{ background:var(--mint); }

  .footband{
    position:absolute;bottom:5.5%;left:6.25%;right:6.25%;
    padding-top:18px;border-top:1px solid var(--rule-on-petrol);
    display:flex;align-items:center;gap:24px;
    font-size:clamp(10px,.78vw,12px);letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted-on-petrol);
  }
  .slide.light .footband{ border-top-color:var(--rule-on-cream);color:var(--muted-on-cream); }
  .footband .tag{ color:var(--aqua); }
  .slide.light .footband .tag{ color:var(--mint); }

  .compass{
    position:absolute;top:50%;right:6.25%;transform:translateY(-50%);
    width:38%;max-width:480px;aspect-ratio:1;opacity:.95;
  }
  .compass svg{ width:100%;height:100%;display:block; }
  .compass.spin svg{ animation: spin 120s linear infinite; }
  @keyframes spin { from {transform:rotate(0)} to {transform:rotate(360deg)} }

  .two-col{ display:grid;grid-template-columns:5fr 6fr;gap:5%;flex:1;align-items:start;padding-top:1%; }
  .two-col-rev{ display:grid;grid-template-columns:6fr 5fr;gap:5%;flex:1;align-items:start;padding-top:1%; }
  .two-col-equal{ display:grid;grid-template-columns:1fr 1fr;gap:6%;flex:1;align-items:center; }
  .left-col{ display:flex;flex-direction:column;justify-content:center;height:100%; }
  .right-col{ display:flex;flex-direction:column;justify-content:center;height:100%;align-items:center; }

  .check-list{ list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:14px; }
  .check-list li{
    display:flex;gap:12px;align-items:flex-start;
    font-size:clamp(12px,.95vw,14px);line-height:1.5;color:var(--text-on-petrol);
  }
  .slide.light .check-list li{ color:var(--text-on-cream); }
  .check-list li::before{
    content:"✓";display:flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:50%;background:var(--check-green);color:#fff;
    font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;
  }

  .nav{ position:absolute;inset:0;display:flex;z-index:50; }
  .nav > div{ flex:1;cursor:pointer; }
  .progress{position:absolute;top:0;left:0;right:0;height:2px;background:transparent;z-index:60;}
  .progress .fill{height:100%;background:var(--aqua);width:0%;transition:width .55s cubic-bezier(.22,.7,.2,1);}
  .counter{
    position:absolute;bottom:3%;left:6.25%;
    font-size:clamp(10px,.78vw,12px);letter-spacing:.22em;color:var(--muted-on-petrol);z-index:55;
  }

  .slide .stagger > * { opacity:0;transform:translateY(12px);transition:opacity .6s ease, transform .6s ease; }
  .slide.active .stagger > * { opacity:1;transform:translateY(0); }
  .slide.active .stagger > *:nth-child(1){ transition-delay:.15s; }
  .slide.active .stagger > *:nth-child(2){ transition-delay:.25s; }
  .slide.active .stagger > *:nth-child(3){ transition-delay:.35s; }
  .slide.active .stagger > *:nth-child(4){ transition-delay:.45s; }
  .slide.active .stagger > *:nth-child(5){ transition-delay:.55s; }
  .slide.active .stagger > *:nth-child(6){ transition-delay:.65s; }
  .slide.active .stagger > *:nth-child(7){ transition-delay:.75s; }
  .slide.active .stagger > *:nth-child(8){ transition-delay:.85s; }

  .illus{ width:100%;max-width:520px;display:block;margin:0 auto; }
  .illus svg{ width:100%;height:auto;display:block; }

  .quote-block{
    padding:14px 18px;border-left:2px solid var(--aqua);
    font-family:'Fraunces',serif;font-style:italic;font-weight:300;
    font-size:clamp(13px,1.05vw,16px);line-height:1.5;color:var(--text-on-petrol);
    margin-top:12px;max-width:54ch;
  }
  .slide.light .quote-block{border-left-color:var(--mint);color:var(--text-on-cream);}

  .examples{
    margin-top:14px;padding:14px 16px;border:1px solid var(--rule-on-petrol);border-radius:6px;
    background:rgba(124,174,171,.04);
  }
  .slide.light .examples{ border-color:var(--rule-on-cream);background:rgba(46,95,85,.04); }
  .examples-title{
    font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--aqua);
    margin-bottom:10px;font-weight:500;
  }
  .slide.light .examples-title{ color:var(--check-green); }
  .examples-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .examples-list li{
    font-size:clamp(11.5px,.92vw,14px);line-height:1.5;
    color:var(--muted-on-petrol);font-style:italic;
    padding-left:14px;position:relative;
  }
  .slide.light .examples-list li{ color:var(--muted-on-cream); }
  .examples-list li::before{
    content:"›";position:absolute;left:0;top:0;color:var(--aqua);font-style:normal;font-weight:500;
  }
  .slide.light .examples-list li::before{ color:var(--mint); }


  /* ===== Extras para a versão revisada ===== */
  .journey-step{
    display:flex;gap:16px;align-items:flex-start;padding:11px 0;
    border-bottom:1px solid var(--rule-on-petrol);
  }
  .slide.light .journey-step{ border-bottom-color:var(--rule-on-cream); }
  .journey-step:last-child{ border-bottom:none; }
  .journey-step .jn{
    font-family:'Fraunces',serif;font-weight:400;font-style:italic;
    font-size:clamp(20px,2vw,30px);color:var(--aqua);min-width:42px;line-height:1;
  }
  .slide.light .journey-step .jn{ color:var(--mint); }
  .journey-step .jc h4{
    font-family:'Fraunces',serif;font-weight:500;font-size:clamp(14px,1.25vw,19px);
    color:var(--text-on-petrol);margin-bottom:3px;
  }
  .slide.light .journey-step .jc h4{ color:var(--text-on-cream); }
  .journey-step .jc .q{
    font-style:italic;font-size:clamp(11.5px,.92vw,13.5px);color:var(--aqua-soft);margin-bottom:4px;
  }
  .slide.light .journey-step .jc .q{ color:var(--mint); }
  .journey-step .jc p{
    font-size:clamp(11px,.9vw,13px);line-height:1.5;color:var(--muted-on-petrol);
  }
  .slide.light .journey-step .jc p{ color:var(--muted-on-cream); }

  .transition-note{
    margin-top:12px;font-style:italic;font-family:'Fraunces',serif;font-weight:300;
    font-size:clamp(12px,1vw,15px);color:var(--aqua);line-height:1.45;
  }
  .slide.light .transition-note{ color:var(--mint); }

  .tool-chip{
    display:inline-block;margin-top:8px;padding:4px 11px;border:1px solid var(--rule-on-petrol);
    border-radius:99px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--aqua);font-weight:500;
  }
  .slide.light .tool-chip{ border-color:var(--rule-on-cream);color:var(--check-green); }

  /* Section divider ("O Pulo do Gato") */
  .divider-slide{ align-items:flex-start;justify-content:center; }
  .divider-kicker{
    font-size:clamp(11px,.95vw,14px);letter-spacing:.32em;text-transform:uppercase;
    color:var(--aqua);font-weight:500;margin-bottom:22px;
  }
  .divider-num{
    font-family:'Fraunces',serif;font-weight:300;font-size:clamp(60px,9vw,150px);
    color:var(--aqua);line-height:.9;opacity:.18;position:absolute;
    right:6.25%;bottom:8%;
  }
  .badge-bonus{
    position:absolute;top:3.5%;left:6.25%;
    display:inline-flex;align-items:center;gap:7px;
    padding:5px 13px;border:1px solid var(--aqua);border-radius:99px;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--aqua);font-weight:500;
  }
  .badge-bonus::before{ content:"★";font-size:10px; }
  .slide.light .badge-bonus{ border-color:var(--mint);color:var(--mint); }
</style>
</head>

<div class="stage">
  <div class="deck" id="deck">
    <div class="progress"><div class="fill" id="progFill"></div></div>
    <div class="counter" id="counter">01 / 17</div>

  </div>
</div>

// ===== Algoritmo (radial) =====

// ---- render ----
const deck = document.getElementById('deck');
const counter = document.getElementById('counter');
const progFill = document.getElementById('progFill');
const total = slides.length;
let current = 0;

slides.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = `slide ${s.theme}`;
  let body = s.body.replace(/__COMPASS__/g, COMPASS_SVG);
  el.innerHTML = `<div class="pagemark">${s.mark || ''}</div>${body}`;
  deck.insertBefore(el, document.getElementById('counter'));
});

const slideEls = Array.from(deck.querySelectorAll('.slide'));
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function render(){
  slideEls.forEach((el, i) => {
    el.classList.remove('active','exit');
    if(i === current) el.classList.add('active');
    else if(i < current) el.classList.add('exit');
  });
  counter.textContent = pad(current+1) + ' / ' + pad(total);
  progFill.style.width = ((current+1)/total*100) + '%';
}
function go(d){
  const n = current + d;
  if(n<0 || n>=total) return;
  current = n;
  render();
}
document.getElementById('navPrev').addEventListener('click', () => go(-1));
document.getElementById('navNext').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight' || e.key===' ') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
let tx=null;
deck.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
deck.addEventListener('touchend', e => {
  if(tx===null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if(Math.abs(dx) > 40) go(dx<0?1:-1);
  tx=null;
}, {passive:true});
render();
</script>
